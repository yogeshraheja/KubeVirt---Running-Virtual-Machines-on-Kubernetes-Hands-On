apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: demo8vm
  labels:
    app:  demo8app
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: demo8app
    spec:
      domain:
        devices:
          disks:
          - name: containerdisk
            disk: 
              bus: virtio
          - name: containerinitdisk
            disk:
              bus: virtio
          - name: pvcdisk
            disk:
              bus: virtio
        resources:
          requests:
            memory: 512M
      volumes:
      - name: containerdisk
        containerDisk: 
          image: kubevirt/fedora-cloud-container-disk-demo
      - name: containerinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            password: fedora
            chpasswd:
              expire: False
      - name: pvcdisk
        persistentVolumeClaim:
          claimName: demo8pvc 
