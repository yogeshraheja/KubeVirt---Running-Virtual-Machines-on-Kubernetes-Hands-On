apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: demo7vm
  labels:
    app:  demo7app
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: demo7app
    spec:
      domain:
        devices:
          disks:
          - name: containerdisk
            disk: 
              bus: virtio
          - name: containerinitdisk
            disk:
              bus: virtio
        resources:
          requests:
            memory: 512M
      volumes:
      - name: containerdisk
        containerDisk: 
          image: kubevirt/fedora-cloud-container-disk-demo
      - name: containerinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            users:
              - name: user1
                ssh_authorized_keys: 
                  - ssh-rsa  user1@ThinknyxMacBook.lan
